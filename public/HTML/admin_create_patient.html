<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Create Patient | MedNexus</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="sidebar-head">
                <div class="avatar">A</div>
                <div>
                    <h2>MedNexus</h2><small>Admin Suite</small>
                </div>
            </div>
            <nav class="side-links"><a class="" href="admin.html">🏠 Overview</a><a class=""
                    href="admin_create_doctor.html">🧑‍⚕️ Create Doctor</a><a class="active"
                    href="admin_create_patient.html">👤 Create Patient</a><a class="" href="admin_doctors.html">📋
                    Doctors</a><a class="" href="admin_patients.html">👥 Patients</a><a class=""
                    href="admin_appointments.html">📅 Appointments</a><a class="" href="admin_prescriptions.html">💊
                    Prescriptions</a><a class="" href="admin_pharmacy.html">🛒 Pharmacy</a><a class=""
                    href="admin_emr.html">📁 EMR</a><a class="" href="admin_billing.html">🧾 Billing</a><a class=""
                    href="admin_staff.html">🏢 Staff</a><a class="" href="admin_meetings.html">🤝 Meetings</a><a
                    class="" href="../index.html">↩ Logout</a></nav>
        </aside>
        <main class="main">
            <header class="topbar">
                <div>
                    <h1>Create Patient</h1>
                    <p>Admin-side patient account creation.</p>
                </div>
                <div style="display:flex;gap:10px;align-items:center;max-width:460px;width:100%"><input
                        id="globalSearch" placeholder="Search this page..." oninput="filterCards()"></div>
            </header>
            <section class="panel">
                <div class="panel-head">
                    <h2>Create Patient Account</h2>
                    <p>POST /signup/patient</p>
                </div>
                <form id="patientForm">
                    <div class="grid-3">
                        <div class="form-group"><label>Name</label><input id="pname" required></div>
                        <div class="form-group"><label>Email</label><input id="email" type="email" required></div>
                        <div class="form-group"><label>Password</label><input id="password" type="password" required>
                        </div>
                        <div class="form-group"><label>Confirm Password</label><input id="confirmPassword"
                                type="password" required></div>
                        <div class="form-group"><label>Phone</label><input id="phone" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group"><label>DOB</label><input id="dob" type="date" required></div>
                        <div class="form-group"><label>Gender</label><select id="gender">
                                <option value="male">male</option>
                                <option value="female">female</option>
                            </select></div>
                    </div><button class="btn">Create Patient</button><input id="result" readonly placeholder="Status">
                </form>
            </section>
        </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="../js/main.js"></script>
    <script src="../js/admin_create_patient.js"></script>
</body>

</html>
