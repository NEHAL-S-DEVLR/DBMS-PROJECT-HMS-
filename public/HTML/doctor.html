<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Dashboard</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="dashboard"><aside class="sidebar"><div class="sidebar-head"><div class="avatar">D</div><div><h2>MedNexus</h2><small>Doctor Portal</small></div></div><nav class="side-links"><a class="active" href="#profile">🏠 Profile</a><a href="#appointments">📅 Appointments</a><a href="#prescribe">💊 Prescribe</a><a href="#emr">📁 EMR</a><a href="#patients">👥 Patients</a><a href="../index.html">↩ Logout</a></nav></aside><main class="main"><header class="topbar"><div><h1>Doctor Clinical Workspace</h1><p>Complete appointments, write prescriptions and add EMR notes.</p></div></header><section class="panel" id="profile"><div class="grid-3"><div class="card"><b>Name</b><br><span id="name"></span></div><div class="card"><b>Email</b><br><span id="email"></span></div><div class="card"><b>Phone</b><br><span id="phone"></span></div><div class="card"><b>DOB</b><br><span id="dob"></span></div><div class="card"><b>Gender</b><br><span id="gender"></span></div><div id="specializationBox" class="card" style="display:none"><b>Specialization</b><br><span id="specialization"></span></div></div></section><section class="panel" id="appointments"><div class="panel-head"><h2>My Appointments</h2><button class="btn-outline" onclick="loadAppointments()">Refresh</button></div><div id="appointmentstatus"></div><div id="appointmentContainer"></div><div id="debugBox1" class="debug"></div></section><section class="panel" id="prescribe"><div class="panel-head"><h2>Create Prescription</h2></div><form id="prescriptionForm"><div class="grid-3"><input id="prescriptionAppointmentId" placeholder="Appointment ID" required><input id="medicineName" placeholder="Medicine" required><input id="dosage" placeholder="Dosage" required><input id="durationDays" type="number" placeholder="Duration Days" required><input id="prescriptionNotes" placeholder="Notes"></div><button class="btn">Save Prescription</button><input id="prescriptionResult" readonly></form></section><section class="panel" id="emr"><div class="panel-head"><h2>Add EMR</h2></div><form id="emrForm"><div class="grid-3"><input id="emrAppointmentId" placeholder="Appointment ID" required><input id="diagnosis" placeholder="Diagnosis" required><input id="vitals" placeholder="Vitals" required><input id="allergies" placeholder="Allergies"><input id="clinicalNotes" placeholder="Clinical Notes"></div><button class="btn">Save EMR</button><input id="emrResult" readonly></form></section><section class="panel" id="patients"><div class="panel-head"><h2>Patients</h2><button class="btn-outline" onclick="loadPatients()">Refresh</button></div><div id="pstatus"></div><div id="patientContainer"></div></section></main></div><div id="toast" class="toast"></div><script src="../js/main.js"></script><script src="../js/doctor-advanced.js"></script></body></html>
