<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Delete Account | MedNexus</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body>
		<div class="dashboard">
			<aside class="sidebar">
				<div class="sidebar-head">
					<div class="avatar">P</div>
					<div>
						<h2>MedNexus</h2>
						<small>Patient Portal</small>
					</div>
				</div>
				<nav class="side-links">
					<a class="" href="patient.html">🏠 Profile</a
					><a class="" href="patient_book.html">📅 Book Appointment</a
					><a class="" href="patient_appointments.html"
						>📋 Appointments</a
					><a class="" href="patient_prescriptions.html"
						>💊 Prescriptions</a
					><a class="" href="patient_pharmacy.html">🛒 Pharmacy</a
					><a class="" href="patient_tracker.html"
						>❤️ Health Tracker</a
					><a class="" href="patient_billing.html">🧾 Billing</a
					><a class="" href="patient_chat.html">💬 Doctor Chat</a
					><a class="active" href="patient_delete.html"
						>⚠ Delete Account</a
					><a class="" href="../index.html">↩ Logout</a>
				</nav>
			</aside>
			<main class="main">
				<header class="topbar">
					<div>
						<h1>Delete Account</h1>
						<p>Deactivate your patient account safely.</p>
					</div>
					<div
						style="
							display: flex;
							gap: 10px;
							align-items: center;
							max-width: 460px;
							width: 100%;
						"
					>
						<input
							id="globalSearch"
							placeholder="Search this page..."
							oninput="filterCards()"
						/>
					</div>
				</header>
				<section class="panel danger-zone">
					<div class="panel-head">
						<h2>Deactivate Account</h2>
						<p>This will set your login as deactive.</p>
					</div>
					<form id="deleteForm">
						<div class="grid-3">
							<div class="form-group">
								<label>Email</label
								><input id="email" type="email" required />
							</div>
							<div class="form-group">
								<label>Password</label
								><input
									id="password"
									type="password"
									required
								/>
							</div>
							<div class="form-group">
								<label>Confirm Password</label
								><input
									id="confirmPassword"
									type="password"
									required
								/>
							</div>
						</div>
						<button class="btn-danger">Deactivate My Account</button
						><input id="result" readonly />
					</form>
				</section>
			</main>
		</div>
		<div id="toast" class="toast"></div>
		<script src="../js/main.js"></script>
		<script src="../js/patient_delete.js"></script>
	</body>
</html>
