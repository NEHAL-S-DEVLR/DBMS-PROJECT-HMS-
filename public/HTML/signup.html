<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><div class="form-left"><a href="../index.html" class="logo" style="background:white;color:#0f172a;width:max-content;padding:8px 12px;border-radius:12px;margin-bottom:36px">MedNexus <span>Hospitals</span></a><h1>Secure hospital access.</h1><p>One login route. Three dashboards. Admin, doctor and patient access are separated using role-based session authentication.</p></div><div class="form-right"><div class="form-box"><h2>Patient Signup</h2><p>Create a patient account that appears in MySQL Workbench.</p><form id="signupForm"><div class="form-group"><label>Email</label><input id="email" type="email" name="email" placeholder="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" name="password" placeholder="Password" required></div><div class="form-group"><label>Role</label><select name="role" id="role"><option value="doctor">doctor</option><option value="patient">patient</option><option value="admin">admin</option></select></div><button class="btn" style="width:100%" type="submit">Login</button><input id="result" type="text" readonly placeholder="Status"><div id="forgotBox" style="display:none;margin-top:14px"><a class="btn-outline" style="width:100%" href="./forgotpassword.html">Forgot password?</a></div><a href="signup.html" class="btn-outline" style="width:100%;margin-top:12px">Patient Signup</a></form></div></div></div><script>signupForm.innerHTML=`<div class="form-group"><label>Name</label><input id="Name" required></div><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><div class="form-group"><label>Confirm Password</label><input id="confirmPassword" type="password" required></div><div class="form-group"><label>Phone</label><input id="phone" pattern="[0-9]{10}" required></div><div class="form-group"><label>DOB</label><input id="dob" type="date" required></div><div class="form-group"><label>Gender</label><select id="gender"><option value="male">male</option><option value="female">female</option></select></div><button class="btn" style="width:100%">Sign Up</button><input id="result" readonly placeholder="Result">`;signupForm.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirmPassword.value){alert('Passwords do not match');return}try{const r=await fetch('/signup/patient',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:Name.value,email:email.value,password:password.value,phone_no:phone.value,dob:dob.value,gender:gender.value})});const d=await r.json();result.value=d.message||'Signup request sent';if(r.ok)setTimeout(()=>location.href='login.html',900)}catch(err){result.value=err.message}});</script></body></html>
