<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Patient Signup</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><div class="form-left"><a href="../index.html" class="logo" style="background:white;color:#0f172a;width:max-content;padding:8px 12px;border-radius:12px;margin-bottom:36px">MedNexus <span>Hospitals</span></a><h1>Patient registration.</h1><p>Create a patient account through /signup/patient.</p></div><div class="form-right"><div class="form-box"><h2>Patient Signup</h2><form id="signupForm"><div class="form-group"><label>Name</label><input id="Name" required></div><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><div class="form-group"><label>Confirm Password</label><input id="confirmPassword" type="password" required></div><div class="form-group"><label>Phone</label><input id="phone" pattern="[0-9]{10}" required></div><div class="form-group"><label>DOB</label><input id="dob" type="date" required></div><div class="form-group"><label>Gender</label><select id="gender"><option value="male">male</option><option value="female">female</option></select></div><button class="btn" style="width:100%">Sign Up</button><input id="result" readonly placeholder="Result"><a href="login.html" class="btn-outline" style="width:100%;margin-top:12px">Back to Login</a></form></div></div></div><script src="../js/main.js"></script><script>signupForm.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirmPassword.value){result.value='Passwords do not match';return}try{const d=await postJSON('/signup/patient',{name:Name.value,email:email.value,password:password.value,phone_no:phone.value,dob:dob.value,gender:gender.value});result.value=d.message||'Signup successful';setTimeout(()=>location.href='login.html',900)}catch(err){result.value=err.message}});</script></body></html>
