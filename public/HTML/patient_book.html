<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Book Appointment | MedNexus</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body>
		<div class="dashboard">
			<aside class="sidebar">
				<div class="sidebar-head">
					<div class="avatar">P</div>
					<div>
						<h2>MedNexus</h2>
						<small>Patient Portal</small>
					</div>
				</div>
				<nav class="side-links">
					<a class="" href="patient.html">🏠 Profile</a
					><a class="active" href="patient_book.html"
						>📅 Book Appointment</a
					><a class="" href="patient_appointments.html"
						>📋 Appointments</a
					><a class="" href="patient_prescriptions.html"
						>💊 Prescriptions</a
					><a class="" href="patient_pharmacy.html">🛒 Pharmacy</a
					><a class="" href="patient_tracker.html"
						>❤️ Health Tracker</a
					><a class="" href="patient_billing.html">🧾 Billing</a
					><a class="" href="patient_chat.html">💬 Doctor Chat</a
					><a class="" href="patient_delete.html">⚠ Delete Account</a
					><a class="" href="../index.html">↩ Logout</a>
				</nav>
			</aside>
			<main class="main">
				<header class="topbar">
					<div>
						<h1>Book Appointment</h1>
						<p>
							Select a doctor and submit an appointment request.
						</p>
					</div>
					<div
						style="
							display: flex;
							gap: 10px;
							align-items: center;
							max-width: 460px;
							width: 100%;
						"
					>
						<input
							id="globalSearch"
							placeholder="Search this page..."
							oninput="filterCards()"
						/>
					</div>
				</header>
				<section class="panel">
					<div class="panel-head">
						<h2>Select Doctor</h2>
						<button class="btn-outline" onclick="loadDoctors()">
							Refresh
						</button>
					</div>
					<form id="reqappointment">
						<input type="hidden" id="selectedDoctorId" />
						<div id="status"></div>
						<div id="doctorContainer"></div>
						<div class="grid-3" style="margin-top: 22px">
							<div class="form-group">
								<label>Date</label
								><input type="date" id="date" required />
							</div>
							<div class="form-group">
								<label>Time</label
								><select id="category" required>
									<option value="">Select Time</option>
									<option value="9:00AM">9:00AM</option>
									<option value="10:30 AM">10:30 AM</option>
									<option value="11:15 AM">11:15 AM</option>
									<option value="3:00 PM">3:00 PM</option>
									<option value="7:00 PM">7:00 PM</option>
								</select>
							</div>
							<div class="form-group">
								<label>Reason</label
								><input id="textInput" required />
							</div>
						</div>
						<button class="btn">Submit Request</button>
						<div id="formMessage"></div>
					</form>
				</section>
			</main>
		</div>
		<div id="toast" class="toast"></div>
		<script src="../js/main.js"></script>
		<script src="../js/patient_book.js"></script>
	</body>
</html>
