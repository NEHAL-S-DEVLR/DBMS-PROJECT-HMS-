<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Health Tracker | MedNexus</title>
		<link rel="stylesheet" href="../css/style.css" />
	</head>
	<body>
		<div class="dashboard">
			<aside class="sidebar">
				<div class="sidebar-head">
					<div class="avatar">P</div>
					<div>
						<h2>MedNexus</h2>
						<small>Patient Portal</small>
					</div>
				</div>
				<nav class="side-links">
					<a class="" href="patient.html">🏠 Profile</a
					><a class="" href="patient_book.html">📅 Book Appointment</a
					><a class="" href="patient_appointments.html"
						>📋 Appointments</a
					><a class="" href="patient_prescriptions.html"
						>💊 Prescriptions</a
					><a class="" href="patient_pharmacy.html">🛒 Pharmacy</a
					><a class="active" href="patient_tracker.html"
						>❤️ Health Tracker</a
					><a class="" href="patient_billing.html">🧾 Billing</a
					><a class="" href="patient_chat.html">💬 Doctor Chat</a
					><a class="" href="patient_delete.html">⚠ Delete Account</a
					><a class="" href="../index.html">↩ Logout</a>
				</nav>
			</aside>
			<main class="main">
				<header class="topbar">
					<div>
						<h1>Health Tracker</h1>
						<p>Add and view health records.</p>
					</div>
					<div
						style="
							display: flex;
							gap: 10px;
							align-items: center;
							max-width: 460px;
							width: 100%;
						"
					>
						<input
							id="globalSearch"
							placeholder="Search this page..."
							oninput="filterCards()"
						/>
					</div>
				</header>
				<section class="panel">
					<div class="panel-head">
						<h2>Add Health Tracker</h2>
						<p>POST /advanced/tracker</p>
					</div>
					<form id="trackerForm">
						<div class="grid-4">
							<div class="form-group">
								<label>Weight</label
								><input id="weight" type="number" required />
							</div>
							<div class="form-group">
								<label>BP</label><input id="bp" required />
							</div>
							<div class="form-group">
								<label>Sugar</label
								><input id="sugar" type="number" required />
							</div>
							<div class="form-group">
								<label>Notes</label><input id="notes" />
							</div>
						</div>
						<button class="btn">Save Tracker</button
						><input id="result" readonly />
					</form>
				</section>
				<section class="panel">
					<div class="panel-head">
						<h2>Health Tracker Records</h2>
						<button class="btn-outline" onclick="loadRecords()">
							Refresh
						</button>
					</div>
					<div id="status"></div>
					<div id="trackerContainer"></div>
				</section>
			</main>
		</div>
		<div id="toast" class="toast"></div>
		<script src="../js/main.js"></script>
		<script src="../js/patient_tracker.js"></script>
	</body>
</html>
