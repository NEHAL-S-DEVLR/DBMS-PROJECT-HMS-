<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><div class="form-left"><h1>Password Recovery</h1><p>Only patient password reset is allowed.</p></div><div class="form-right"><div class="form-box"><h2>Forgot Password</h2><form id="forgotPasswordForm"><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>New Password</label><input id="password" type="password" required></div><div class="form-group"><label>Confirm Password</label><input id="confirmPassword" type="password" required></div><button class="btn" style="width:100%">Submit</button><input id="result" readonly><a href="login.html" class="btn-outline" style="width:100%;margin-top:12px">Back</a></form></div></div></div><script>forgotPasswordForm.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirmPassword.value){result.value='Passwords do not match';return}const r=await fetch('/login/forgotpassword',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,confirmPassword:confirmPassword.value})});const d=await r.json();result.value=d.message||'Done'});</script></body></html>
