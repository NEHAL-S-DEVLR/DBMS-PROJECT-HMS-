<!doctype html><html><head><link rel="stylesheet" href="../css/style.css"><title>Forgot Password</title></head><body><div class="form-page"><div class="form-left"><h1>Password Recovery</h1><p>Patient password reset.</p></div><div class="form-right"><div class="form-box"><h2>Forgot Password</h2><form id="forgotPasswordForm"><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" required></div><div class="form-group"><label>Confirm Password</label><input id="confirmPassword" type="password" required></div><input id="result" readonly><button class="btn">Submit</button></form></div></div></div><script>forgotPasswordForm.addEventListener('submit',async e=>{e.preventDefault();if(password.value!==confirmPassword.value){result.value='Passwords do not match';return}const r=await fetch('/login/forgotpassword',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,confirmPassword:confirmPassword.value})});const d=await r.json();result.value=d.message})</script></body></html>
