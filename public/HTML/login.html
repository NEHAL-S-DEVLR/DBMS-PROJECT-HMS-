<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="../css/style.css"></head><body><div class="form-page"><div class="form-left"><a href="../index.html" class="logo" style="background:white;color:#0f172a;width:max-content;padding:8px 12px;border-radius:12px;margin-bottom:36px">MedNexus <span>Hospitals</span></a><h1>Secure hospital access.</h1><p>One login route. Three dashboards. Admin, doctor and patient access are separated using role-based session authentication.</p></div><div class="form-right"><div class="form-box"><h2>Login Portal</h2><p>Select your role and login with credentials from MySQL.</p><form id="loginForm"><div class="form-group"><label>Email</label><input id="email" type="email" name="email" placeholder="email" required></div><div class="form-group"><label>Password</label><input id="password" type="password" name="password" placeholder="Password" required></div><div class="form-group"><label>Role</label><select name="role" id="role"><option value="doctor">doctor</option><option value="patient">patient</option><option value="admin">admin</option></select></div><button class="btn" style="width:100%" type="submit">Login</button><input id="result" type="text" readonly placeholder="Status"><div id="forgotBox" style="display:none;margin-top:14px"><a class="btn-outline" style="width:100%" href="./forgotpassword.html">Forgot password?</a></div><a href="signup.html" class="btn-outline" style="width:100%;margin-top:12px">Patient Signup</a></form></div></div></div><script>role.addEventListener('change',function(){forgotBox.style.display=this.value==='patient'?'block':'none'});loginForm.addEventListener('submit',async e=>{e.preventDefault();const response=await fetch('/login/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,role:role.value})});const data=await response.json();if(response.ok)location.href=data.redirect;result.value=data.message||'Login request sent'});</script></body></html>
